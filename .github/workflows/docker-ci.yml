
name: Build and Test with Docker Hub

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v6

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build and Test Maven Project
      - name: Maven Build and Test
        run: mvn -B clean verify

      # 4. Login to Docker Hub
      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: rakshitharohini
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker Image
      - name: Build Docker Image
        run: docker build -t rakshitharohini/grade-calculator:latest .

      # 6. Push Image to Docker Hub
      - name: Push Image to Docker Hub
        if: github.event_name == 'push'
        run: docker push rakshitharohini/grade-calculator:latest

      # 7. Pull Image from Docker Hub
      - name: Pull Image from Docker Hub
        if: github.event_name == 'push'
        run: docker pull rakshitharohini/grade-calculator:latest

      # 8. Test Docker Hub Image
      - name: Test Docker Hub Image
        if: github.event_name == 'push'
        run: |
          echo "67" | docker run --rm -i rakshitharohini/grade-calculator:latest | tee output.txt
          grep -F "Student Grade: C" output.txt
