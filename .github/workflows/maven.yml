
name: Grade Calculator CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Maven project and run JUnit tests
        run: mvn clean verify

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: rakshitharohini/grade-calculator:latest

      - name: Pull image from Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker pull rakshitharohini/grade-calculator:latest

      - name: Test Docker Hub image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "67" | docker run --rm -i rakshitharohini/grade-calculator:latest | tee output.txt
          grep -F "Student Grade: C" output.txt

      - name: Docker Hub Connection Link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## Grade Calculator CI/CD Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image: rakshitharohini/grade-calculator:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Docker Hub Repository](https://hub.docker.com/r/rakshitharohini/grade-calculator)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull rakshitharohini/grade-calculator:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
